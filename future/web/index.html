<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AcoustSee: Audio-Visual Synthesis Interface">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AcoustSee</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="splashScreen">
    <button id="powerOn" class="power-on-button" role="button" aria-label="Power on" aria-pressed="false">
      <span class="sr-only">Power on</span>
    </button>
  </div>
  <div id="mainContainer" class="main-container" style="display: none;">
    <div class="video-wrapper video-container">
      <video id="videoFeed" autoplay muted playsinline></video>
      <button id="button1" class="grid-button overlay-toggle" role="button" aria-label="Start or stop stream" aria-pressed="false">
        <span class="button-text">Start</span>
      </button>
    </div>
    <button id="button2" class="grid-button" role="button"></button>
    <button id="button3" class="grid-button" role="button"></button>
    <button id="button4" class="grid-button" role="button"></button>
    <button id="button5" class="grid-button" role="button"></button>
    <button id="button6" class="grid-button" role="button"></button>
  </div>
  <canvas id="frameCanvas" style="display: none;" aria-hidden="true"></canvas>
  <div id="debugPanel" style="display: none;" role="log" aria-live="polite"></div>
  <button id="emailDebug" style="display: none;" aria-hidden="true"></button>
  <div id="announcements" aria-live="polite" style="position: absolute; left: -9999px;"></div>  <!-- For TTS announcements -->
  <script type="module" src="./main.js"></script>
</body>
</html>
