<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AcoustSee: Audio-Visual Synthesis Interface">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AcoustSee</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="splashScreen">
    <button id="powerOn" class="power-on-button" role="button" data-i18n-aria="powerOn.aria" aria-pressed="false">
      <!-- visible label populated from translations -->
      <span class="power-label" data-i18n="powerOn.text">Power</span>
      <span class="sr-only" data-i18n="powerOn.sr">Power on</span>
    </button>
  </div>
  <div id="mainContainer" class="main-container" style="display: none;">
    <div class="video-wrapper video-container">
      <!-- remove autoplay: start the camera from a user gesture (power button / Start button) -->
      <video id="videoFeed" muted playsinline data-i18n-aria="videoFeed.aria"></video>
      <button id="button1" class="grid-button overlay-toggle" role="button" data-i18n-aria="button1.normal.start.aria" aria-pressed="false">
        <span class="button-text" data-i18n="button1.normal.start.text">Start</span>
      </button>
    </div>
    <button id="button2" class="grid-button" role="button"><span data-i18n="button2.normal.on.text">Mic On</span></button>
    <button id="button3" class="grid-button" role="button"><span data-i18n="button3.normal.text">Language</span></button>
    <button id="button4" class="grid-button" role="button"><span data-i18n="button4.normal.auto.text">Auto FPS</span></button>
    <button id="button5" class="grid-button" role="button"><span data-i18n="button5.normal.text">Email Console Log</span></button>
    <button id="button6" class="grid-button" role="button"><span data-i18n="button6.normal.text">Settings</span></button>
  </div>
  <canvas id="frameCanvas" style="display: none;" aria-hidden="true" data-i18n-aria="frameCanvas.aria"></canvas>
  <div id="debugPanel" style="display: none;" role="log" aria-live="polite" data-i18n-aria="debugPanel.aria"></div>
  <button id="emailDebug" style="display: none;" aria-hidden="true"></button>
  <div id="announcements" aria-live="polite" role="status" aria-atomic="true" class="sr-only"></div>  <!-- For TTS announcements -->
  <script type="module" src="./main.js"></script>
</body>
</html>
