<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AcoustSee: Audio-Visual Synthesis Interface">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AcoustSee</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="splashScreen">
    <button id="powerOn"></button>
  </div>
  <div id="mainContainer" style="display: none;">
    <video id="videoFeed" autoplay playsinline muted></video>
    <canvas id="frameCanvas" style="display: none;"></canvas> 
    <div id="debugPanel" style="display: none;"></div>
    <button id="button1" class="grid-button"></button>
    <button id="button2" class="grid-button"></button>
    <button id="button3" class="grid-button"></button>
    <button id="button4" class="grid-button"></button>
    <button id="button5" class="grid-button"></button>
    <button id="button6" class="grid-button"></button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
