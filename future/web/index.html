// future/web/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="AcoustSee: Audio-Visual Synthesis Interface">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AcoustSee</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="splashScreen">
    <button id="powerOn" aria-label="Power On"></button>
  </div>
  <div id="mainContainer" style="display: none;">
    <video id="videoFeed" autoplay playsinline muted aria-label="Video Feed"></video>
    <div id="debugPanel" style="display: none;"></div>
    <button id="button1" aria-label="Start/Stop Stream"></button>
    <button id="button2" aria-label="Toggle Microphone"></button>
    <button id="button3" aria-label="Toggle Language/Input"></button>
    <button id="button4" aria-label="Toggle FPS/Save Settings"></button>
    <button id="button5" aria-label="Email Log/Load Settings"></button>
    <button id="button6" aria-label="Toggle Settings Mode"></button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
