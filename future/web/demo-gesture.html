<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AcoustSee Gesture Demo</title>
  <style>
    /* make the main area touch-friendly */
    html,body{height:100%;margin:0}
    #mainContainer { width:100vw; height:100vh; touch-action: none; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; position:relative; }
    #videoFeed { display:block; max-width:100%; max-height:100%; position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.08 }
    #frameCanvas { display:none; } /* used by engine for processing */
    #hintBox { position:absolute; bottom:12px; left:12px; right:12px; background:rgba(0,0,0,0.5); color:#fff; padding:8px 12px; border-radius:6px; font-size:14px; }
    #button1 { position:absolute; top:12px; right:12px; z-index:10 }
  </style>
</head>
<body>
  <div id="mainContainer" role="application" aria-label="AcoustSee main container">
    <video id="videoFeed" autoplay playsinline muted></video>
    <canvas id="frameCanvas" width="640" height="480"></canvas>
    <!-- Optional visual start/stop button for sighted testers -->
    <button id="button1" aria-label="Start or stop processing">Start / Stop</button>
    <div id="hintBox">Tap to toggle. Long-press to enter settings. Swipe left/right in settings to change category.</div>
  </div>

  <script type="module">
    import { createEngine } from './core/engine.js';
    import { initializeAccessibleUI } from './ui/accessible-ui.js';

    const engine = createEngine();

    // DOM mapping expected by the gesture manager
    const DOM = {
      mainContainer: document.getElementById('mainContainer'),
      videoFeed: document.getElementById('videoFeed'),
      frameCanvas: document.getElementById('frameCanvas'),
      button1: document.getElementById('button1'),
    };

    // wire up the accessible gesture UI
    initializeAccessibleUI(engine, DOM);

    // optional: hook the visual button for sighted testers
    DOM.button1.addEventListener('click', (e) => {
      const s = engine.getState();
      if (s.isProcessing) engine.dispatch('stopProcessing', { videoEl: DOM.videoFeed, canvasEl: DOM.frameCanvas });
      else engine.dispatch('startProcessing', { videoEl: DOM.videoFeed, canvasEl: DOM.frameCanvas });
    });

    // expose engine globally for quick dev console testing
    window.__acoustsee_engine = engine;
  </script>
</body>
</html>
